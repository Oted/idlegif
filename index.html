<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Idlegif</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="app-header">
      <h1>Idlegif</h1>
      <button id="btn-refresh" class="success">Refresh</button>
    </div>
    <p class="sub">Select a screensaver — arrows to navigate, OK to apply</p>

    <!-- GIPHY picker (View renders grid or API key prompt here) -->
    <section id="giphy-section"></section>

    <!-- Custom GIF URL (always visible) -->
    <section id="url-section">
      <input type="text" id="url-input" value="https://raw.githubusercontent.com/Oted/idlegif/refs/heads/main/assets/default.gif" spellcheck="false" autocomplete="off">
      <button id="btn-download">Download</button>
    </section>

    <div class="actions">
      <button id="btn-test">Test</button>
      <button id="btn-uninstall" class="danger">Uninstall</button>
    </div>
    <div id="status"></div>
  </div>

  <script src="js/webos.js"></script>
  <script src="js/giphy.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
